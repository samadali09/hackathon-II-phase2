## Prompt

Create specification for: In-Memory Todo Console App

Feature description: A command-line tool to manage todo tasks. Data is ephemeral (reset when app closes).

Data Model:
- Task Entity: id (Integer, auto-incrementing), title (String, required), description (String, optional), status (String enum: "Pending", "Completed" - default "Pending")

Features:
- Add Task: Prompt for Title and Description, auto-generate ID, confirm creation
- List Tasks: Display in table/list format, show [X]/[ ] for status, ID, Title, Status. Show "No tasks found" if empty
- Update Task: Ask for Task ID, allow updating Title or Description, keep original if empty
- Delete Task: Ask for Task ID, remove from memory, show error if ID not found
- Mark Complete: Ask for Task ID, toggle to "Completed"
- User Interaction: App starts -> Show Main Menu (Add, View, Update,...

